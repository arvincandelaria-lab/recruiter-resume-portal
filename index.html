<!-- FORM -->
<form
    id="resumeRequestForm"
    action="https://formspree.io/f/xqpkykqa"
    method="POST">

    <!-- Hidden fields -->
    <input
        type="hidden"
        name="requested_resume"
        id="requestedResume">

    <input
        type="hidden"
        name="_subject"
        id="emailSubject"
        value="New Recruiter Resume Request">

    <!-- Honeypot spam protection -->
    <input
        type="text"
        name="_gotcha"
        style="display:none">

    <!-- NAME -->
    <div class="form-group">

        <label for="name">
            Full Name *
        </label>

        <input
            type="text"
            id="name"
            name="name"
            placeholder="Your full name"
            required>

    </div>

    <!-- COMPANY -->
    <div class="form-group">

        <label for="company">
            Company *
        </label>

        <input
            type="text"
            id="company"
            name="company"
            placeholder="Company name"
            required>

    </div>

    <!-- EMAIL -->
    <div class="form-group">

        <label for="email">
            Work Email *
        </label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="name@company.com"
            required>

    </div>

    <!-- POSITION -->
    <div class="form-group">

        <label for="position">
            Position Hiring For *
        </label>

        <input
            type="text"
            id="position"
            name="position"
            placeholder="e.g. Data Analyst"
            required>

    </div>

    <!-- MESSAGE -->
    <div class="form-group">

        <label for="message">
            Message
        </label>

        <textarea
            id="message"
            name="message"
            rows="4"
            placeholder="Optional message"></textarea>

    </div>

    <!-- SUBMIT -->
    <button
        type="submit"
        class="submit-btn">
        Submit Resume Request
    </button>

    <p class="form-note">
        Your information will be used only to respond
        to your resume request.
    </p>

</form>
